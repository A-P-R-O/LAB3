<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Лабораторна робота №3 - Таксопарк</title>
  <style>
    /* Базові стилі інтерфейсу та модального вікна */
    .tab-content {
      display: none;
    }
    .form-box {
      margin-bottom: 20px;
      padding: 12px;
      border: 1px dashed #666;
      background-color: #fafafa;
      max-width: 700px;
    }
    .form-group {
      margin-bottom: 8px;
    }
    .form-group label {
      display: inline-block;
      width: 180px;
      font-weight: 500;
    }
    .form-group input, .form-group select {
      padding: 4px 8px;
      width: 250px;
    }
    table, th, td {
      border: 1px solid #333;
      border-collapse: collapse;
      padding: 6px 10px;
    }
    th {
      background-color: #eee;
    }
    .delete-btn {
      color: red;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid red;
      background: #ffe6e6;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .delete-btn:hover {
      background: red;
      color: white;
    }
    .editable-cell {
      cursor: pointer;
      position: relative;
    }
    .editable-cell:hover {
      background-color: #fffae6;
      outline: 1px dashed #cca000;
    }
    /* Попап модального вікна помилки */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-card {
      background: white;
      padding: 20px 25px;
      border-radius: 6px;
      max-width: 450px;
      border: 2px solid #cc0000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <h1>Система керування таксопарком (ЛР №3)</h1>

  <!-- Навігація між табами -->
  <div id="tabs-navigation"></div>

  <hr>

  <!-- Секція таблиць та форм -->
  <div id="entities-container"></div>

  <!-- Модальне вікно для попередження про зв'язані сутності -->
  <div id="error-modal" class="modal-overlay">
    <div class="modal-card">
      <h3 style="color: #cc0000; margin-top: 0;">Помилка видалення даних!</h3>
      <p id="modal-error-message"></p>
      <div style="text-align: right;">
        <button type="button" id="modal-close-btn" style="padding: 6px 16px; cursor: pointer;">Зрозуміло</button>
      </div>
    </div>
  </div>

  <script>
    /**
     * Початкова база даних у форматі JS-структур
     */
    const domainData = {
      drivers: {
        title: "Водії",
        columns: ["ID", "ПІБ", "Посвідчення", "Телефон", "Рейтинг", "Статус", "Дії"],
        fields: [
          { key: "id", label: "ID водія:", type: "number", editable: false },
          { key: "name", label: "ПІБ:", type: "text", editable: true },
          { key: "license", label: "№ Посвідчення:", type: "text", editable: true },
          { key: "phone", label: "Телефон:", type: "text", editable: true },
          { key: "rating", label: "Рейтинг (від 1 до 5):", type: "number", step: "0.01", min: "1", max: "5", editable: true },
          { key: "status", label: "Статус:", type: "select", options: ["На лінії", "Вихідний", "На зміні", "На ремонті"], editable: true }
        ],
        items: [
          { id: 1, name: "Кравченко Василь Олексійович", license: "BXT-102938", phone: "+380501112233", rating: 4.95, status: "На лінії" },
          { id: 2, name: "Мельничук Олег Сергійович", license: "BXT-204958", phone: "+380672223344", rating: 4.82, status: "Вихідний" },
          { id: 3, name: "Григоренко Іван Денисович", license: "BXT-394857", phone: "+380933334455", rating: 4.98, status: "На зміні" }
        ]
      },
      cars: {
        title: "Автомобілі",
        columns: ["ID", "Марка / Модель", "Держ. номер", "Рік", "Клас авто", "Пробіг (км)", "Дії"],
        fields: [
          { key: "id", label: "ID авто:", type: "number", editable: false },
          { key: "model", label: "Марка та модель:", type: "text", editable: true },
          { key: "plate", label: "Держ. номер:", type: "text", editable: true },
          { key: "year", label: "Рік випуску:", type: "number", min: "2000", max: "2026", editable: true },
          { key: "category", label: "Клас автомобіля:", type: "select", options: ["Стандарт", "Комфорт+", "Бізнес", "Мінівен"], editable: true },
          { key: "mileage", label: "Пробіг (км):", type: "number", editable: true }
        ],
        items: [
          { id: 101, model: "Toyota Camry", plate: "BH 1234 CT", year: 2021, category: "Комфорт+", mileage: 85000 },
          { id: 102, model: "Renault Megane", plate: "BH 5678 AA", year: 2019, category: "Стандарт", mileage: 142000 },
          { id: 103, model: "Volkswagen Passat", plate: "BH 9988 OE", year: 2022, category: "Бізнес", mileage: 48000 }
        ]
      },
      orders: {
        title: "Замовлення",
        columns: ["№ Замовлення", "ID Водія", "Маршрут", "Тариф", "Вартість (грн)", "Статус", "Дії"],
        fields: [
          { key: "id", label: "№ Замовлення:", type: "number", editable: false },
          { key: "driverId", label: "ID Водія:", type: "number", editable: true },
          { key: "route", label: "Маршрут (Звідки -> Куди):", type: "text", editable: true },
          { key: "tariff", label: "Тариф:", type: "select", options: ["Стандарт", "Комфорт+", "Бізнес"], editable: true },
          { key: "price", label: "Вартість (грн):", type: "number", editable: true },
          { key: "state", label: "Статус замовлення:", type: "select", options: ["Прийнято", "У дорозі", "Виконано", "Скасовано"], editable: true }
        ],
        items: [
          { id: 7001, driverId: 1, route: "вул. Дерибасівська, 1 -> Аеропорт", tariff: "Комфорт+", price: 320, state: "Виконано" },
          { id: 7002, driverId: 3, route: "Залізничний вокзал -> Аркадія", tariff: "Бізнес", price: 280, state: "У дорозі" },
          { id: 7003, driverId: 1, route: "просп. Шевченка, 12 -> вул. Балківська, 35", tariff: "Стандарт", price: 160, state: "Прийнято" }
        ]
      }
    };

    /**
     * Показ модального вікна з повідомленням про помилку видалення зв'язаних даних
     */
    function showErrorModal(message) {
      const modal = document.getElementById("error-modal");
      document.getElementById("modal-error-message").textContent = message;
      modal.style.display = "flex";
    }

    document.getElementById("modal-close-btn").addEventListener("click", () => {
      document.getElementById("error-modal").style.display = "none";
    });

    /**
     * Перевірка цілісності зв'язків перед видаленням
     */
    function canDeleteRecord(entityKey, record) {
      if (entityKey === "drivers") {
        // Перевіряємо, чи закріплений водій за якимось замовленням у таблиці orders
        const relatedOrders = domainData.orders.items.filter(order => Number(order.driverId) === Number(record.id));
        if (relatedOrders.length > 0) {
          const orderIds = relatedOrders.map(o => `№${o.id}`).join(", ");
          return {
            allowed: false,
            reason: `Неможливо видалити водія "${record.name}" (ID: ${record.id}). Дані використовуються в таблиці "Замовлення" для замовлень: ${orderIds}.`
          };
        }
      }
      return { allowed: true };
    }

    /**
     * Логіка інлайн-редагування комірки (Завдання 3.2)
     */
    function makeCellEditable(tdElement, record, fieldConfig) {
      tdElement.classList.add("editable-cell");
      tdElement.title = "Клацніть для зміни значення";

      tdElement.addEventListener("click", function startEdit() {
        // Якщо інпут вже відкритий, не створюємо повторно
        if (tdElement.querySelector("input, select")) return;

        const originalValue = record[fieldConfig.key];
        tdElement.textContent = "";

        let input;
        if (fieldConfig.type === "select") {
          input = document.createElement("select");
          fieldConfig.options.forEach(opt => {
            const option = document.createElement("option");
            option.value = opt;
            option.textContent = opt;
            if (opt === originalValue) option.selected = true;
            input.appendChild(option);
          });
        } else {
          input = document.createElement("input");
          input.type = fieldConfig.type === "number" ? "number" : "text";
          input.value = originalValue;
          if (fieldConfig.step) input.step = fieldConfig.step;
        }

        input.style.width = "90%";
        tdElement.appendChild(input);
        input.focus();

        let isSaved = false;

        function saveChange() {
          if (isSaved) return;
          isSaved = true;

          let updatedVal = input.value.trim();
          if (fieldConfig.type === "number") {
            updatedVal = Number(updatedVal);
          }

          // Оновлюємо внутрішню модель даних
          record[fieldConfig.key] = updatedVal;

          // Оновлюємо вигляд у DOM
          tdElement.textContent = updatedVal;
        }

        function cancelChange() {
          if (isSaved) return;
          isSaved = true;
          tdElement.textContent = originalValue;
        }

        // Збереження при втраті фокусу (клік у будь-якій іншій частині документа)
        input.addEventListener("blur", saveChange);

        // Обробка натискання клавіш Enter та Escape
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            saveChange();
          } else if (e.key === "Escape") {
            cancelChange();
          }
        });
      });
    }

    /**
     * Створення одного рядка таблиці з кнопкою видалення
     */
    function createTableRow(record, entityKey, entityConfig) {
      const row = document.createElement("tr");

      entityConfig.fields.forEach(field => {
        const td = document.createElement("td");
        td.textContent = record[field.key] !== undefined ? record[field.key] : "";

        // Якщо поле позначене як editable, додаємо функціонал кліку для зміни
        if (field.editable) {
          makeCellEditable(td, record, field);
        }

        row.appendChild(td);
      });

      // Комірка з кнопкою видалення (Завдання 3.1)
      const actionTd = document.createElement("td");
      actionTd.style.textAlign = "center";

      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.className = "delete-btn";
      deleteBtn.textContent = "✕";
      deleteBtn.title = "Видалити рядок";

      deleteBtn.addEventListener("click", () => {
        // Перевіряємо зв'язки
        const check = canDeleteRecord(entityKey, record);
        if (!check.allowed) {
          showErrorModal(check.reason);
          return;
        }

        if (confirm(`Ви дійсно бажаєте видалити цей рядок?`)) {
          // 1. Видаляємо з масиву JS
          const index = entityConfig.items.indexOf(record);
          if (index !== -1) {
            entityConfig.items.splice(index, 1);
          }
          // 2. Видаляємо рядок з DOM
          row.remove();
        }
      });

      actionTd.appendChild(deleteBtn);
      row.appendChild(actionTd);

      return row;
    }

    /**
     * Створення форми додавання
     */
    function createAddForm(entityKey, entityConfig, tbodyElement) {
      const formWrapper = document.createElement("div");
      formWrapper.className = "form-box";

      const formTitle = document.createElement("h3");
      formTitle.textContent = `Додати запис: ${entityConfig.title}`;
      formWrapper.appendChild(formTitle);

      const form = document.createElement("form");

      entityConfig.fields.forEach(field => {
        const group = document.createElement("div");
        group.className = "form-group";

        const label = document.createElement("label");
        label.textContent = field.label;
        label.htmlFor = `${entityKey}-${field.key}`;
        group.appendChild(label);

        let inputElement;
        if (field.type === "select") {
          inputElement = document.createElement("select");
          field.options.forEach(opt => {
            const option = document.createElement("option");
            option.value = opt;
            option.textContent = opt;
            inputElement.appendChild(option);
          });
        } else {
          inputElement = document.createElement("input");
          inputElement.type = field.type;
          if (field.step) inputElement.step = field.step;
          if (field.min) inputElement.min = field.min;
          if (field.max) inputElement.max = field.max;
        }

        inputElement.id = `${entityKey}-${field.key}`;
        inputElement.name = field.key;
        inputElement.required = true;

        group.appendChild(inputElement);
        form.appendChild(group);
      });

      const submitBtn = document.createElement("button");
      submitBtn.type = "submit";
      submitBtn.textContent = `+ Додати до таблиці "${entityConfig.title}"`;
      submitBtn.style.padding = "6px 16px";
      submitBtn.style.marginTop = "8px";
      submitBtn.style.cursor = "pointer";
      form.appendChild(submitBtn);

      form.addEventListener("submit", function(event) {
        event.preventDefault();
        const formData = new FormData(form);
        const newRecord = {};

        entityConfig.fields.forEach(field => {
          let val = formData.get(field.key);
          if (field.type === "number") val = Number(val);
          newRecord[field.key] = val;
        });

        entityConfig.items.push(newRecord);
        const newRow = createTableRow(newRecord, entityKey, entityConfig);
        tbodyElement.appendChild(newRow);
        form.reset();
      });

      formWrapper.appendChild(form);
      return formWrapper;
    }

    /**
     * Рендеринг таблиці та форми для кожної сутності
     */
    function renderEntitySection(entityKey, entityConfig) {
      const section = document.createElement("div");
      section.id = `entity-${entityKey}`;
      section.className = "tab-content";

      const heading = document.createElement("h2");
      heading.textContent = `Журнал: ${entityConfig.title}`;
      section.appendChild(heading);

      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");

      entityConfig.columns.forEach(colName => {
        const th = document.createElement("th");
        th.textContent = colName;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      entityConfig.items.forEach(record => {
        const tr = createTableRow(record, entityKey, entityConfig);
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);

      const formComponent = createAddForm(entityKey, entityConfig, tbody);
      section.appendChild(formComponent);
      section.appendChild(table);

      return section;
    }

    /**
     * Перемикання вкладок
     */
    function setActiveTab(activeKey) {
      Object.keys(domainData).forEach(key => {
        const block = document.getElementById(`entity-${key}`);
        if (block) {
          block.style.display = (key === activeKey) ? "block" : "none";
        }
      });

      const buttons = document.querySelectorAll(".nav-tab-btn");
      buttons.forEach(btn => {
        if (btn.dataset.key === activeKey) {
          btn.style.fontWeight = "bold";
          btn.style.backgroundColor = "#e0e0e0";
        } else {
          btn.style.fontWeight = "normal";
          btn.style.backgroundColor = "";
        }
      });
    }

    /**
     * Ініціалізація сторінки
     */
    function init() {
      const nav = document.getElementById("tabs-navigation");
      const container = document.getElementById("entities-container");
      const keys = Object.keys(domainData);

      keys.forEach(key => {
        const entity = domainData[key];

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "nav-tab-btn";
        btn.dataset.key = key;
        btn.textContent = entity.title;
        btn.style.marginRight = "8px";
        btn.style.padding = "6px 14px";
        btn.style.cursor = "pointer";

        btn.addEventListener("click", () => setActiveTab(key));
        nav.appendChild(btn);

        const entitySection = renderEntitySection(key, entity);
        container.appendChild(entitySection);
      });

      if (keys.length > 0) {
        setActiveTab(keys[0]);
      }
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>

</body>
</html>
